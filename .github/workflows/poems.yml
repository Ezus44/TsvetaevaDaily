name: Встроенные стихи

# Собирает стихи с Викитеки в app/src/main/assets/poems, коммитит их в ветку
# и собирает APK, в котором они уже есть. Запуск: Actions → «Встроенные стихи» → Run workflow
# (или сам — при изменении сборщика tools/poems).
on:
  workflow_dispatch:
  push:
    paths: ["tools/poems/**", ".github/workflows/poems.yml"]

permissions:
  contents: write

env:
  # Встраиваются в APK: права на тексты давно истекли (все авторы умерли больше 70 лет назад).
  BUNDLE: tsvetaeva,parnok,pushkin,mayakovsky,blok,lermontov,esenin

jobs:
  poems:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Собрать стихи с Викитеки
        run: gradle -p tools/poems run --args="--out ../../app/src/main/assets/poems --bundle $BUNDLE" --console=plain -q

      - name: Сохранить в ветку
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/poems
          if git diff --cached --quiet; then
            echo "Стихи не изменились"
          else
            git commit -m "Встроенные стихи: обновлены с Викитеки"
            git push
          fi

      - name: Тесты логики
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Сборка APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk stikhi-dnya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stikhi-dnya-apk
          path: stikhi-dnya.apk
